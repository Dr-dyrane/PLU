  <text x="600" y="720" text-anchor="middle" fill="#4f6557" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="34" font-weight="650" letter-spacing="1">PHOTO UNAVAILABLE</text>
