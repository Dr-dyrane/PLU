    <path d="M18 60C-128 68-198-12-198-130-68-143 17-77 18 60Z" fill="#b7c9bd" stroke-width="16"/>
    <path d="M46 20c122 20 193-48 207-162-126-24-206 38-207 162Z" fill="#9eb5a6" stroke-width="16"/>
    <path d="M-150-93C-82-62-31-17 4 49M218-112C143-85 91-41 52 16" stroke-width="12" opacity=".85"/>
