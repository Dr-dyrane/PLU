  <title id="title">Produce photo unavailable</title>
  <desc id="description">A neutral produce placeholder shown only when the product photograph cannot load.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ef"/>
      <stop offset="1" stop-color="#dce5df"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".72"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
