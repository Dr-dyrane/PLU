name: Export Batch 05 production worktree

on:
  push:
    branches:
      - work/batch-05-production
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: rm -rf .git
      - uses: actions/upload-artifact@v4
        with:
          name: batch05-production-worktree
          path: .
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
