name: Batch 05 production

on:
  push:
    branches:
      - work/batch-05-production
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-audit-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Generate corrected Batch 04 and new Batch 05
        run: npm run generate:batch05

      - name: Download and decode all 200 Batch 04–05 images
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/build-media-contact-sheets.py
          cp artifacts/media-review/summary.json public/media-render-audit.json

      - name: Validate Wikimedia metadata and live image responses
        run: |
          npm run audit:batch04-media
          npm run audit:batch05-media

      - name: Validate types and production export
        run: |
          npm run typecheck
          npm run build

      - name: Upload visual image-review sheets
        uses: actions/upload-artifact@v4
        with:
          name: batch04-batch05-media-review
          path: artifacts/media-review/
          if-no-files-found: error
          retention-days: 14

      - name: Commit locked generated data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            data/batch-05-candidates.json \
            data/batch-05-source.json \
            data/batches/batch-04.json \
            data/batches/batch-05.json \
            data/story-seeds/batch-04-generated.json \
            data/story-seeds/batch-05-generated.json \
            public/media-resolution-batch04.json \
            public/media-resolution-batch05.json \
            public/media-render-audit.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish corrected Batch 04 and Batch 05 [skip ci]"
          git push
