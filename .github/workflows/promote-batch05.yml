name: Promote validated Batch 05

on:
  workflow_run:
    workflows:
      - Batch 05 production
    types:
      - completed

permissions:
  contents: write

env:
  RELEASE_BRANCH: work/batch-05-production

jobs:
  promote:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'work/batch-05-production'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out the completed release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Re-verify committed release data and export
        run: |
          npm run typecheck
          npm run build

      - name: Fast-forward main only after every release gate passes
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:main
